[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math_operations_kseahtan"
version = "1.0.3"
authors = [
  { name="Tan Kim Seah", email="your-email@example.com" }
]
description = "An interactive terminal calculator with basic and advanced math operations."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["math_operations_kseahtan*"]

[project.scripts]
run-calculator = "math_operations_kseahtan.run:main"

